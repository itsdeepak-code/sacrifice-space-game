<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacrifice for Power</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(180deg, #000428, #004e92);
        }
        
        .ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #4ECDC4;
            min-width: 200px;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 14px;
        }
        
        .sacrifice-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ff6b6b;
            max-width: 300px;
            transition: all 0.3s ease;
        }
        
        .sacrifice-panel.minimized {
            transform: translateX(280px);
            opacity: 0.7;
        }
        
        .sacrifice-panel.minimized:hover {
            transform: translateX(0px);
            opacity: 1;
        }
        
        .minimize-btn {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(255, 107, 107, 0.8);
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sacrifice-option {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 5px;
            padding: 10px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }
        
        .sacrifice-option:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff9999;
        }
        
        .sacrifice-option.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .sacrifice-title {
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .sacrifice-cost {
            color: #ff9999;
            font-size: 10px;
        }
        
        .sacrifice-benefit {
            color: #99ff99;
            font-size: 10px;
        }
        
        .controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 107, 107, 0.95);
            color: white;
            padding: 25px;
            border-radius: 15px;
            border: 3px solid #ff6b6b;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
            animation: sacrificeNotify 2s ease-out;
        }
        
        @keyframes sacrificeNotify {
            0% { 
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            20% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #ff6b6b;
            text-align: center;
            display: none;
            max-width: 400px;
        }
        
        .restart-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        .health-bar, .shield-bar, .weapon-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            margin: 3px 0;
            overflow: hidden;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff9999);
            transition: width 0.3s ease;
        }
        
        .shield-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ECDC4, #44A08D);
            transition: width 0.3s ease;
        }
        
        .weapon-fill {
            height: 100%;
            background: linear-gradient(90deg, #F7971E, #FFD200);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1000" height="700"></canvas>
    
    <div class="ui-panel">
        <div style="color: #4ECDC4; font-weight: bold; margin-bottom: 10px;">⚡ SHIP STATUS</div>
        <div class="stat">
            <span>Health:</span>
            <span id="health-text">100</span>
        </div>
        <div class="health-bar"><div class="health-fill" id="health-bar"></div></div>
        
        <div class="stat">
            <span>Shields:</span>
            <span id="shield-text">0</span>
        </div>
        <div class="shield-bar"><div class="shield-fill" id="shield-bar"></div></div>
        
        <div class="stat">
            <span>Weapon Power:</span>
            <span id="weapon-text">1</span>
        </div>
        <div class="weapon-bar"><div class="weapon-fill" id="weapon-bar"></div></div>
        
        <div class="stat">
            <span>Score:</span>
            <span id="score">0</span>
        </div>
        <div class="stat">
            <span>Wave:</span>
            <span id="wave">1</span>
        </div>
    </div>
    
    <div class="sacrifice-panel" id="sacrifice-panel">
        <button class="minimize-btn" onclick="toggleSacrificePanel()" title="Hide/Show Sacrifices">×</button>
        <div style="color: #ff6b6b; font-weight: bold; margin-bottom: 10px;">🔥 SACRIFICES AVAILABLE</div>
        <div id="sacrifice-options"></div>
    </div>
    
    <div class="controls">
        <strong>WASD:</strong> Move | <strong>SPACE:</strong> Shoot | <strong>Click Sacrifices:</strong> Trade for Power<br>
        <span style="color: #ff9999; font-size: 11px;">💡 TIP: Make sacrifices during combat! Game continues running in real-time!</span>
    </div>
    
    <div class="game-over" id="game-over">
        <h2 id="game-over-title">Mission Status</h2>
        <p id="game-over-text"></p>
        <button class="restart-btn" onclick="restartGame()">New Mission</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let gameState = {
            player: {
                x: canvas.width / 2,
                y: canvas.height - 100,
                width: 30,
                height: 30,
                speed: 5,
                health: 100,
                maxHealth: 100,
                shields: 0,
                maxShields: 0,
                weaponPower: 1,
                maxWeaponPower: 5,
                fireRate: 10,
                fireTimer: 0
            },
            bullets: [],
            enemies: [],
            enemyBullets: [],
            explosions: [],
            particles: [],
            stars: [],
            score: 0,
            wave: 1,
            gameOver: false,
            keys: {},
            sacrificesMade: {
                healthForWeapon: 0,
                healthForShields: 0,
                healthForSpeed: 0,
                shieldsForDamage: 0,
                speedForHealth: 0
            }
        };
        
        // Available sacrifices
        const sacrifices = [
            {
                id: 'healthForWeapon',
                title: 'Blood for Steel',
                description: 'Sacrifice 30 Health for +1 Weapon Power',
                cost: { health: 30 },
                benefit: { weaponPower: 1 },
                maxUses: 3,
                canUse: () => gameState.player.health > 30 && gameState.player.weaponPower < 5
            },
            {
                id: 'healthForShields',
                title: 'Life for Protection',
                description: 'Sacrifice 40 Health for 50 Shield Capacity',
                cost: { health: 40 },
                benefit: { maxShields: 50, shields: 50 },
                maxUses: 2,
                canUse: () => gameState.player.health > 40 && gameState.player.maxShields < 100
            },
            {
                id: 'healthForSpeed',
                title: 'Vitality for Velocity',
                description: 'Sacrifice 25 Health for +2 Speed',
                cost: { health: 25 },
                benefit: { speed: 2 },
                maxUses: 2,
                canUse: () => gameState.player.health > 25 && gameState.player.speed < 9
            },
            {
                id: 'shieldsForDamage',
                title: 'Defense for Offense',
                description: 'Sacrifice ALL Shields for Double Damage (this wave)',
                cost: { shields: 'all', maxShields: 'all' },
                benefit: { doubleDamage: true },
                maxUses: 1,
                canUse: () => gameState.player.maxShields > 0
            },
            {
                id: 'speedForHealth',
                title: 'Agility for Endurance',
                description: 'Sacrifice 3 Speed for +60 Health',
                cost: { speed: 3 },
                benefit: { health: 60, maxHealth: 60 },
                maxUses: 1,
                canUse: () => gameState.player.speed > 5
            }
        ];
        
        // Initialize stars
        for (let i = 0; i < 100; i++) {
            gameState.stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.1
            });
        }
        
        // Classes
        class Bullet {
            constructor(x, y, vx, vy, isPlayer = true, damage = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.isPlayer = isPlayer;
                this.damage = damage;
                this.size = isPlayer ? 4 : 3;
                this.color = isPlayer ? '#4ECDC4' : '#ff6b6b';
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                return this.x >= 0 && this.x <= canvas.width && this.y >= 0 && this.y <= canvas.height;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                
                // Glow effect
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                ctx.shadowBlur = 0;
            }
        }
        
        class Enemy {
            constructor(x, y, type = 'basic') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.health = type === 'boss' ? 5 : type === 'heavy' ? 3 : 1;
                this.maxHealth = this.health;
                this.size = type === 'boss' ? 40 : type === 'heavy' ? 25 : 15;
                this.speed = type === 'boss' ? 0.8 : type === 'heavy' ? 1.2 : 2;
                this.fireTimer = Math.random() * 60;
                this.angle = Math.random() * Math.PI * 2;
                this.color = type === 'boss' ? '#ff4444' : type === 'heavy' ? '#ffaa44' : '#44ff44';
            }
            
            update() {
                this.angle += 0.02;
                this.x += Math.sin(this.angle) * this.speed * 0.5;
                this.y += this.speed;
                
                // Fire at player occasionally
                this.fireTimer--;
                if (this.fireTimer <= 0) {
                    this.fireTimer = 60 + Math.random() * 60;
                    const dx = gameState.player.x - this.x;
                    const dy = gameState.player.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 300) {
                        gameState.enemyBullets.push(new Bullet(
                            this.x, this.y,
                            (dx / distance) * 3,
                            (dy / distance) * 3,
                            false
                        ));
                    }
                }
                
                return this.y < canvas.height + 50 && this.health > 0;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Ship body
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                
                // Health bar
                if (this.health < this.maxHealth) {
                    ctx.fillStyle = '#ff6b6b';
                    const healthWidth = (this.health / this.maxHealth) * this.size;
                    ctx.fillRect(-this.size/2, -this.size/2 - 8, healthWidth, 4);
                }
                
                ctx.restore();
            }
            
            takeDamage(damage) {
                this.health -= damage;
                if (this.health <= 0) {
                    // Award points based on enemy type
                    const points = this.type === 'boss' ? 100 : this.type === 'heavy' ? 50 : 20;
                    gameState.score += points;
                    
                    // Create explosion
                    createExplosion(this.x, this.y, this.size);
                    return true;
                }
                return false;
            }
        }
        
        function createExplosion(x, y, size) {
            gameState.explosions.push({
                x: x,
                y: y,
                size: 0,
                maxSize: size * 1.5,
                life: 30
            });
            
            // Create particles
            for (let i = 0; i < 10; i++) {
                gameState.particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 20,
                    color: `hsl(${Math.random() * 60 + 20}, 100%, 50%)`
                });
            }
        }
        
        function spawnWave() {
            const enemyCount = 3 + gameState.wave;
            const heavyCount = Math.floor(gameState.wave / 2);
            const bossCount = gameState.wave % 5 === 0 ? 1 : 0;
            
            // Basic enemies
            for (let i = 0; i < enemyCount; i++) {
                const x = Math.random() * (canvas.width - 100) + 50;
                const y = Math.random() * -200 - 50;
                gameState.enemies.push(new Enemy(x, y, 'basic'));
            }
            
            // Heavy enemies
            for (let i = 0; i < heavyCount; i++) {
                const x = Math.random() * (canvas.width - 100) + 50;
                const y = Math.random() * -300 - 100;
                gameState.enemies.push(new Enemy(x, y, 'heavy'));
            }
            
            // Boss enemy
            for (let i = 0; i < bossCount; i++) {
                const x = canvas.width / 2;
                const y = -100;
                gameState.enemies.push(new Enemy(x, y, 'boss'));
            }
        }
        
        function makeSacrifice(sacrificeId) {
            const sacrifice = sacrifices.find(s => s.id === sacrificeId);
            if (!sacrifice || !sacrifice.canUse() || 
                gameState.sacrificesMade[sacrificeId] >= sacrifice.maxUses) {
                return;
            }
            
            // Apply costs
            Object.keys(sacrifice.cost).forEach(stat => {
                if (sacrifice.cost[stat] === 'all') {
                    gameState.player[stat] = 0;
                } else {
                    gameState.player[stat] = Math.max(0, gameState.player[stat] - sacrifice.cost[stat]);
                }
            });
            
            // Apply benefits
            Object.keys(sacrifice.benefit).forEach(stat => {
                if (stat === 'doubleDamage') {
                    gameState.player.doubleDamage = true;
                } else {
                    gameState.player[stat] = Math.min(
                        gameState.player['max' + stat.charAt(0).toUpperCase() + stat.slice(1)] || 999,
                        gameState.player[stat] + sacrifice.benefit[stat]
                    );
                }
            });
            
            gameState.sacrificesMade[sacrificeId]++;
            
            // Show feedback
            showSacrificeNotification(sacrifice);
            updateSacrificeUI();
            
            // Auto-minimize sacrifice panel after use
            setTimeout(() => {
                const panel = document.getElementById('sacrifice-panel');
                panel.classList.add('minimized');
            }, 2000);
        }
        
        function toggleSacrificePanel() {
            const panel = document.getElementById('sacrifice-panel');
            panel.classList.toggle('minimized');
        }
        
        function showSacrificeNotification(sacrifice) {
            // Create notification element
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(255, 107, 107, 0.95);
                color: white;
                padding: 20px 30px;
                border-radius: 10px;
                border: 2px solid #ff6b6b;
                font-size: 18px;
                font-weight: bold;
                z-index: 100;
                text-align: center;
                box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
                animation: sacrificeNotify 2s ease-out;
            `;
            
            notification.innerHTML = `
                <div style="margin-bottom: 10px;">🔥 SACRIFICE MADE! 🔥</div>
                <div style="font-size: 16px; color: #ffcccc;">${sacrifice.title}</div>
                <div style="font-size: 14px; margin-top: 8px; color: #fff;">
                    ${Object.keys(sacrifice.benefit).map(key => 
                        key === 'doubleDamage' ? 'DOUBLE DAMAGE ACTIVATED!' : 
                        `+${sacrifice.benefit[key]} ${key.toUpperCase()}`
                    ).join(', ')}
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // Remove notification after 2 seconds
            setTimeout(() => {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 2000);
        }
        
        function updateSacrificeUI() {
            const container = document.getElementById('sacrifice-options');
            container.innerHTML = '';
            
            sacrifices.forEach(sacrifice => {
                const uses = gameState.sacrificesMade[sacrifice.id] || 0;
                const canUse = sacrifice.canUse() && uses < sacrifice.maxUses;
                
                const div = document.createElement('div');
                div.className = 'sacrifice-option' + (canUse ? '' : ' disabled');
                div.onclick = canUse ? () => makeSacrifice(sacrifice.id) : null;
                
                div.innerHTML = `
                    <div class="sacrifice-title">${sacrifice.title}</div>
                    <div>${sacrifice.description}</div>
                    <div class="sacrifice-cost">Cost: ${JSON.stringify(sacrifice.cost)}</div>
                    <div class="sacrifice-benefit">Gain: ${JSON.stringify(sacrifice.benefit)}</div>
                    <div style="font-size: 10px; color: #888;">Uses: ${uses}/${sacrifice.maxUses}</div>
                `;
                
                container.appendChild(div);
            });
        }
        
        function updateUI() {
            const player = gameState.player;
            
            document.getElementById('health-text').textContent = Math.max(0, player.health);
            document.getElementById('shield-text').textContent = Math.max(0, player.shields);
            document.getElementById('weapon-text').textContent = player.weaponPower;
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('wave').textContent = gameState.wave;
            
            document.getElementById('health-bar').style.width = (player.health / player.maxHealth * 100) + '%';
            document.getElementById('shield-bar').style.width = (player.shields / Math.max(player.maxShields, 1) * 100) + '%';
            document.getElementById('weapon-bar').style.width = (player.weaponPower / player.maxWeaponPower * 100) + '%';
        }
        
        function gameLoop() {
            if (gameState.gameOver) return;
            
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 4, 40, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            gameState.stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
                ctx.fillStyle = `rgba(255, 255, 255, ${star.size / 3})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            
            // Handle input
            const player = gameState.player;
            if (gameState.keys['a'] || gameState.keys['A']) player.x -= player.speed;
            if (gameState.keys['d'] || gameState.keys['D']) player.x += player.speed;
            if (gameState.keys['w'] || gameState.keys['W']) player.y -= player.speed;
            if (gameState.keys['s'] || gameState.keys['S']) player.y += player.speed;
            
            // Keep player in bounds
            player.x = Math.max(15, Math.min(canvas.width - 15, player.x));
            player.y = Math.max(15, Math.min(canvas.height - 15, player.y));
            
            // Player shooting
            if (gameState.keys[' ']) {
                if (player.fireTimer <= 0) {
                    const damage = player.weaponPower * (player.doubleDamage ? 2 : 1);
                    gameState.bullets.push(new Bullet(player.x, player.y - 20, 0, -8, true, damage));
                    player.fireTimer = player.fireRate;
                }
            }
            if (player.fireTimer > 0) player.fireTimer--;
            
            // Update bullets
            gameState.bullets = gameState.bullets.filter(bullet => {
                const alive = bullet.update();
                if (alive) bullet.draw();
                return alive;
            });
            
            gameState.enemyBullets = gameState.enemyBullets.filter(bullet => {
                const alive = bullet.update();
                if (alive) bullet.draw();
                return alive;
            });
            
            // Update enemies
            gameState.enemies = gameState.enemies.filter(enemy => {
                const alive = enemy.update();
                if (alive) enemy.draw();
                return alive;
            });
            
            // Collision detection
            gameState.bullets.forEach((bullet, bulletIndex) => {
                gameState.enemies.forEach((enemy, enemyIndex) => {
                    const dx = bullet.x - enemy.x;
                    const dy = bullet.y - enemy.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < enemy.size / 2 + bullet.size) {
                        if (enemy.takeDamage(bullet.damage)) {
                            gameState.enemies.splice(enemyIndex, 1);
                        }
                        gameState.bullets.splice(bulletIndex, 1);
                    }
                });
            });
            
            // Enemy bullets hit player
            gameState.enemyBullets.forEach((bullet, bulletIndex) => {
                const dx = bullet.x - player.x;
                const dy = bullet.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 20) {
                    if (player.shields > 0) {
                        player.shields = Math.max(0, player.shields - bullet.damage);
                    } else {
                        player.health = Math.max(0, player.health - bullet.damage);
                    }
                    gameState.enemyBullets.splice(bulletIndex, 1);
                    
                    if (player.health <= 0) {
                        endGame(false);
                    }
                }
            });
            
            // Draw player
            ctx.fillStyle = '#4ECDC4';
            ctx.fillRect(player.x - 15, player.y - 15, 30, 30);
            
            // Player shield effect
            if (player.shields > 0) {
                ctx.strokeStyle = `rgba(68, 236, 196, ${player.shields / player.maxShields})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x, player.y, 25, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // Update explosions
            gameState.explosions = gameState.explosions.filter(explosion => {
                explosion.size += explosion.maxSize / 30;
                explosion.life--;
                
                const alpha = explosion.life / 30;
                const gradient = ctx.createRadialGradient(
                    explosion.x, explosion.y, 0,
                    explosion.x, explosion.y, explosion.size
                );
                gradient.addColorStop(0, `rgba(255, 255, 100, ${alpha})`);
                gradient.addColorStop(0.5, `rgba(255, 107, 107, ${alpha * 0.8})`);
                gradient.addColorStop(1, `rgba(255, 0, 0, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(explosion.x, explosion.y, explosion.size, 0, Math.PI * 2);
                ctx.fill();
                
                return explosion.life > 0;
            });
            
            // Update particles
            gameState.particles = gameState.particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life--;
                
                ctx.fillStyle = particle.color;
                ctx.fillRect(particle.x - 2, particle.y - 2, 4, 4);
                
                return particle.life > 0;
            });
            
            // Check wave completion
            if (gameState.enemies.length === 0) {
                gameState.wave++;
                player.doubleDamage = false; // Reset double damage
                spawnWave();
            }
            
            // Check victory
            if (gameState.wave > 15) {
                endGame(true);
            }
            
            updateUI();
            requestAnimationFrame(gameLoop);
        }
        
        function endGame(victory) {
            gameState.gameOver = true;
            const gameOverDiv = document.getElementById('game-over');
            const titleDiv = document.getElementById('game-over-title');
            const textDiv = document.getElementById('game-over-text');
            
            if (victory) {
                titleDiv.textContent = '🎉 VICTORY! 🎉';
                titleDiv.style.color = '#4ECDC4';
                textDiv.textContent = `Your sacrifices paid off! You survived all waves with ${gameState.player.health} health remaining. Final score: ${gameState.score}`;
            } else {
                titleDiv.textContent = '💀 DEFEATED 💀';
                titleDiv.style.color = '#ff6b6b';
                textDiv.textContent = `Your sacrifices weren't enough. You reached wave ${gameState.wave} with a final score of ${gameState.score}. Sometimes the price of power is too high.`;
            }
            
            gameOverDiv.style.display = 'block';
        }
        
        function restartGame() {
            gameState = {
                player: {
                    x: canvas.width / 2,
                    y: canvas.height - 100,
                    width: 30,
                    height: 30,
                    speed: 5,
                    health: 100,
                    maxHealth: 100,
                    shields: 0,
                    maxShields: 0,
                    weaponPower: 1,
                    maxWeaponPower: 5,
                    fireRate: 10,
                    fireTimer: 0
                },
                bullets: [],
                enemies: [],
                enemyBullets: [],
                explosions: [],
                particles: [],
                stars: gameState.stars,
                score: 0,
                wave: 1,
                gameOver: false,
                keys: {},
                sacrificesMade: {
                    healthForWeapon: 0,
                    healthForShields: 0,
                    healthForSpeed: 0,
                    shieldsForDamage: 0,
                    speedForHealth: 0
                }
            };
            
            document.getElementById('game-over').style.display = 'none';
            updateSacrificeUI();
            spawnWave();
            gameLoop();
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.key] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            gameState.keys[e.key] = false;
        });
        
        // Start game
        updateSacrificeUI();
        spawnWave();
        gameLoop();
    </script>
</body>
</html>
